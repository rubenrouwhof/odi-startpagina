name: Publiceer naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # nodig om de Release aan te maken
  pages: write
  id-token: write

# Laat een lopende publicatie afmaken; nieuwe pushes wachten.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true
      - name: Bouw
        run: cd sites/odi && hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" --destination ../../public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Verpak gebouwde site
        run: tar czf odi-site.tar.gz -C public .
      - name: Publiceer release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: build-${{ github.run_number }}
          files: odi-site.tar.gz

  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
