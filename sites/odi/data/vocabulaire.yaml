# Toegestane waarden per facet. Dit bestand is de bron van waarheid: het
# importscript mapt hiernaartoe en de CI-check in .github/workflows/validate.yml
# weigert frontmatter met waarden die hier niet in staan.
#
# Sleutel = slug (zoals in frontmatter en URL), waarde = weergavenaam.
#
# 'expertise' is de bovenste as en komt overeen met de indeling in Wies (zie
# sites/start/data/expertises.yaml). De kennisbank begon bij programma- en
# projectmanagement; nieuwe bronnen uit andere gebieden krijgen hun eigen
# expertise, zodat de collectie kan groeien zonder herindeling.

